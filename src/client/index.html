<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OMP</title>
    <meta name="theme-color" content="#17171a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180x180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: dark;
        --pi-control-font-size: 14px;
        --pi-control-font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        --pi-control-monospace-font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --pi-bg:                 #17171a;
        --pi-surface:            #232324;
        --pi-surface-hover:      #2a2a2b;
        --pi-terminal-bg:        #111113;
        --pi-terminal-text:      rgba(255,255,255,0.9);
        --pi-border:             #333335;
        --pi-border-muted:       #2a2a2b;
        --pi-text:               rgba(255,255,255,0.9);
        --pi-text-secondary:     rgba(255,255,255,0.7);
        --pi-text-bright:        #ffffff;
        --pi-muted:              rgba(255,255,255,0.5);
        --pi-dim:                rgba(255,255,255,0.3);
        --pi-accent:             #3C7EFF;
        --pi-accent-border:      #306FFF;
        --pi-selection-bg:       #1a2540;
        --pi-success:            #00b42a;
        --pi-success-border:     #009a29;
        --pi-success-bg:         #0a2018;
        --pi-success-surface:    #0d2a1e;
        --pi-success-ring:       #00b42a55;
        --pi-warning:            #ff7d00;
        --pi-warning-border:     #d26c00;
        --pi-warning-surface:    #1e1508;
        --pi-danger:             #f53f3f;
        --pi-purple:             #a871f5;
        --pi-purple-border:      #7c3cff;
        --pi-purple-surface:     #1c1030;
        --pi-overlay:            #0008;
        --pi-shadow-soft:        #0006;
        --pi-shadow:             #0008;
        --pi-shadow-strong:      #000b;
        --pi-bg-overlay-soft:    #17171add;
        --pi-bg-overlay:         #17171ae6;
        --pi-success-bg-overlay: #0a2018ee;
        --pi-terminal-selection: #2e3a5a;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--pi-bg); color: var(--pi-text); }
      body { min-height: 100dvh; }
    </style>
  </head>
  <body>
    <omp-web-app></omp-web-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
