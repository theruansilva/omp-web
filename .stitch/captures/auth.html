<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1.0">
  <title>PI WEB — Authentication</title>
  <style>*{box-sizing:border-box}body{background:#070912;color:#e1e4ea;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:1.5rem}.card{background:#101527;border:1px solid #1f2742;border-radius:14px;padding:2.25rem;width:100%;max-width:420px;box-shadow:0 12px 32px rgba(0,0,0,0.6)}.badge{display:inline-block;padding:0.2rem 0.55rem;background:rgba(56,139,253,0.15);border:1px solid rgba(56,139,253,0.3);border-radius:999px;font-size:0.72rem;font-weight:600;color:#58a6ff;margin-bottom:0.75rem;text-transform:uppercase;letter-spacing:0.04em}h1{font-size:1.35rem;margin:0 0 0.4rem;color:#fff}p{font-size:0.875rem;color:#8b949e;margin:0 0 1.5rem;line-height:1.45}.form-group{margin-bottom:1rem}label{display:block;font-size:0.8rem;font-weight:500;color:#c9d1d9;margin-bottom:0.35rem}input[type="text"],input[type="password"]{width:100%;padding:0.75rem 0.85rem;background:#070912;border:1px solid #1f2742;border-radius:8px;color:#fff;font-size:0.92rem;transition:border-color 0.15s,box-shadow 0.15s}input[type="text"]:focus,input[type="password"]:focus{outline:none;border-color:#388bfd;box-shadow:0 0 0 3px rgba(56,139,253,0.2)}input::placeholder{color:#484f58}.btn{width:100%;padding:0.8rem;background:#238636;border:none;border-radius:8px;color:#fff;font-size:0.92rem;font-weight:600;cursor:pointer;transition:background 0.15s;margin-top:0.5rem}.btn:hover{background:#2ea043}.btn:active{background:#1f7a31}.error-box{display:none;background:rgba(248,81,73,0.12);border:1px solid rgba(248,81,73,0.35);border-radius:8px;color:#f85149;padding:0.65rem 0.85rem;font-size:0.82rem;margin-bottom:1.25rem;line-height:1.4}.hint{font-size:0.75rem;color:#6e7681;margin-top:1.25rem;text-align:center;line-height:1.4}code{background:#161b22;color:#e1e4ea;padding:0.15rem 0.35rem;border-radius:4px;font-size:0.78rem;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.toggle-link{display:block;margin-top:1rem;text-align:center;font-size:0.8rem;color:#58a6ff;text-decoration:none;cursor:pointer}.toggle-link:hover{text-decoration:underline}</style>
<style data-stitch-frozen="true">*{box-sizing:border-box}body{background:rgb(7,9,18);color:rgb(225,228,234);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0px;padding:1.5rem}.card{background:rgb(16,21,39);border:1px solid rgb(31,39,66);border-radius:14px;padding:2.25rem;width:100%;max-width:420px;box-shadow:rgba(0,0,0,0.6) 0px 12px 32px}.badge{display:inline-block;padding:0.2rem 0.55rem;background:rgba(56,139,253,0.15);border:1px solid rgba(56,139,253,0.3);border-radius:999px;font-size:0.72rem;font-weight:600;color:rgb(88,166,255);margin-bottom:0.75rem;text-transform:uppercase;letter-spacing:0.04em}h1{font-size:1.35rem;margin:0px 0px 0.4rem;color:rgb(255,255,255)}p{font-size:0.875rem;color:rgb(139,148,158);margin:0px 0px 1.5rem;line-height:1.45}.form-group{margin-bottom:1rem}label{display:block;font-size:0.8rem;font-weight:500;color:rgb(201,209,217);margin-bottom:0.35rem}input[type="text"],input[type="password"]{width:100%;padding:0.75rem 0.85rem;background:rgb(7,9,18);border:1px solid rgb(31,39,66);border-radius:8px;color:rgb(255,255,255);font-size:0.92rem;transition:border-color 0.15s,box-shadow 0.15s}input[type="text"]:focus,input[type="password"]:focus{outline:none;border-color:rgb(56,139,253);box-shadow:rgba(56,139,253,0.2) 0px 0px 0px 3px}input::placeholder{color:rgb(72,79,88)}.btn{width:100%;padding:0.8rem;background:rgb(35,134,54);border-width:medium;border-style:none;border-color:currentcolor;border-image:none;border-radius:8px;color:rgb(255,255,255);font-size:0.92rem;font-weight:600;cursor:pointer;transition:background 0.15s;margin-top:0.5rem}.btn:hover{background:rgb(46,160,67)}.btn:active{background:rgb(31,122,49)}.error-box{display:none;background:rgba(248,81,73,0.12);border:1px solid rgba(248,81,73,0.35);border-radius:8px;color:rgb(248,81,73);padding:0.65rem 0.85rem;font-size:0.82rem;margin-bottom:1.25rem;line-height:1.4}.hint{font-size:0.75rem;color:rgb(110,118,129);margin-top:1.25rem;text-align:center;line-height:1.4}code{background:rgb(22,27,34);color:rgb(225,228,234);padding:0.15rem 0.35rem;border-radius:4px;font-size:0.78rem;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.toggle-link{display:block;margin-top:1rem;text-align:center;font-size:0.8rem;color:rgb(88,166,255);text-decoration:none;cursor:pointer}.toggle-link:hover{text-decoration:underline}</style><style id="stitch-desktop-normalization">html, body { min-width: 1280px !important; width: 1280px !important; min-height: 800px !important; margin: 0 auto !important; overflow-x: hidden !important; }</style></head>
<body>
  <div class="card">
    <div class="badge">Segurança</div>
    <h1>PI WEB</h1>
    <p>Autenticação necessária para acessar esta instância.</p>

    <div id="errorBox" class="error-box"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Nome de Usuário</label>
        <input type="text" id="username" name="username" placeholder="Seu usuário" autocomplete="username" autofocus required value="">
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="Sua senha" autocomplete="current-password" required value="">
      </div>
      <button type="submit" class="btn">Entrar</button>
      <a href="#" id="showTokenBtn" class="toggle-link">Ou entrar com Token de Acesso</a>
    </form>

    <form id="tokenForm" style="display: none;">
      <div class="form-group">
        <label for="tokenInput">Token de Acesso</label>
        <input type="password" id="tokenInput" name="token" placeholder="Insira o auth token" required value="">
      </div>
      <button type="submit" class="btn">Entrar com Token</button>
      <a href="#" id="showLoginBtn" class="toggle-link">Voltar para Usuário e Senha</a>
    </form>
    <div class="hint">Token salvo em <code>~/.omp-web/auth-token</code> ou <code>OMP_WEB_AUTH_TOKEN</code>.</div>
  </div>

  

</body></html>
