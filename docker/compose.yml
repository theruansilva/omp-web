name: omp-web

x-omp-web-build: &omp-web-build
  context: .
  dockerfile: Dockerfile
  args:
    OPENSUSE_IMAGE: ${OMP_WEB_OPENSUSE_IMAGE:-opensuse/tumbleweed}
    NODEJS_MAJOR: ${OMP_WEB_NODEJS_MAJOR:-22}
    NODEJS_REPO: ${OMP_WEB_NODEJS_REPO:-auto}
    OMP_WEB_EXTRA_ZYPPER_PACKAGES: ${OMP_WEB_EXTRA_ZYPPER_PACKAGES:-}
    OMP_WEB_UID: ${OMP_WEB_UID:-1000}
    OMP_WEB_GID: ${OMP_WEB_GID:-1000}
    OMP_WEB_VERSION: ${OMP_WEB_VERSION:-latest}
    PI_VERSION: ${PI_VERSION:-latest}
    CACHE_BUST: ${CACHE_BUST:-local}

x-omp-web-environment: &omp-web-environment
  HOME: /data/home
  XDG_CONFIG_HOME: /data/config
  OMP_WEB_DATA_DIR: /data/omp-web
  OMP_WEB_SESSIOND_SOCKET: /data/omp-web/sessiond.sock
  PI_CODING_AGENT_DIR: /data/pi-agent
  HOSTEXEC_IMAGE: ${HOSTEXEC_IMAGE:-alpine:3.22}
  HOSTEXEC_MODE: ${HOSTEXEC_MODE:-disabled}
  OMP_WEB_MAX_UPLOAD_BYTES: ${OMP_WEB_MAX_UPLOAD_BYTES:-67108864}
  OMP_WEB_DOCKER_RUNTIME: "1"
  OMP_WEB_DOCKER_MODE: runtime
  OMP_WEB_DOCKER_INSTALL_DIR: ${OMP_WEB_DOCKER_INSTALL_DIR:?set by docker/install.sh}
  OMP_WEB_DOCKER_HELPER_IMAGE: ${OMP_WEB_IMAGE:-omp-web:local}
  COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-omp-web}

x-omp-web-volumes: &omp-web-volumes
  - type: bind
    source: ${OMP_WEB_DOCKER_DATA_DIR:-./data}
    target: /data

services:
  sessiond:
    build: *omp-web-build
    image: ${OMP_WEB_IMAGE:-omp-web:local}
    command: ["omp-web-sessiond"]
    restart: unless-stopped
    user: "${OMP_WEB_UID:-1000}:${OMP_WEB_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-0}"
    security_opt:
      - label=disable
    environment: *omp-web-environment
    volumes: *omp-web-volumes
    healthcheck:
      test: ["CMD-SHELL", "test -S /data/omp-web/sessiond.sock"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    build: *omp-web-build
    image: ${OMP_WEB_IMAGE:-omp-web:local}
    command: ["omp-web-server"]
    restart: unless-stopped
    depends_on:
      sessiond:
        condition: service_healthy
    user: "${OMP_WEB_UID:-1000}:${OMP_WEB_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-0}"
    security_opt:
      - label=disable
    environment:
      <<: *omp-web-environment
      OMP_WEB_HOST: 0.0.0.0
      OMP_WEB_PORT: "8504"
    ports:
      - "${OMP_WEB_BIND_ADDR:-127.0.0.1}:${OMP_WEB_PORT:-8504}:8504"
    volumes: *omp-web-volumes
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8504/api/omp-web/runtime >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
